[project]
name = "rl-lab"
version = "0.1.0"
description = "Gather, inspect and compare what reinforcement-learning agents represent."
readme = "README.md"
authors = [
    { name = "Andreas-Sjogren-Furst", email = "91537952+Andreas-Sjogren-Furst@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2",
    "pyarrow>=14",
    "pydantic>=2",
    "pyyaml>=6",
    "scikit-learn>=1.3",
]

[project.scripts]
rl-lab = "rl_lab.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
