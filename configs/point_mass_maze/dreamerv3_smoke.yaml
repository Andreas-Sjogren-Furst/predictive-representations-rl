# Short GPU smoke test of the DreamerV3 config: ~5k env steps on a less busy queue, to confirm a GPU run
# collects episodes, trains and exits cleanly before committing 48 h to the full run.
env: point_mass_maze
algo: dreamerv3
mode: online
variant: smoke
obs_type: state
task: reach_top_left
seeds: [0]
budget:
  env_steps: 5_000
overrides: {}
resources:
  queue: gpul40s
  walltime: "1:00"
