# One-step FB: task-agnostic offline pretraining on ExORL RND data, zero-shot evaluation on every task.
env: point_mass_maze
algo: onestep_fb
mode: offline
obs_type: state
dataset: exorl_rnd
seeds: [0]
budget:
  train_steps: 1_000_000
# Passed to third_party/onestep-fb/main.py as --agent.<key>=<value>; values follow the README's ExORL settings.
overrides:
  agent.backward_repr_hidden_dims: "(256,256,256)"
  agent.forward_repr_hidden_dims: "(1024,1024,1024)"
  agent.actor_hidden_dims: "(1024,1024,1024)"
  agent.activation: relu
  agent.latent_dim: 50
  agent.discount: 0.98
  agent.tau: 0.01
  agent.alpha: 0
  agent.tanh_squash: False
