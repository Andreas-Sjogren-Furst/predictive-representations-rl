# One-step FB alpha sweep on point_mass_maze: alpha weights the behaviour-cloning term of the actor loss.
# The base config uses alpha=0 (README walker setting), under which the policy drifts from the data and
# zero-shot returns stay near 0. 0.03-0.3 are the README's OGBench maze values; 1.0 is one-step FB's default.
extends: ../onestep_fb.yaml
variant: alpha0.1
overrides:
  agent.alpha: 0.1
resources:
  queue: gpul40s     # schedules much faster than gpua100
  walltime: "6:00"   # the alpha=0 run took 1.4-2.8 h
